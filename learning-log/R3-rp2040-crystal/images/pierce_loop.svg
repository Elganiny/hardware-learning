<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive" font-size="15" fill="#1e1e1e">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9" fill="none" stroke="#7048e8" stroke-width="1.8"/></marker>
  </defs>
  <rect width="800" height="470" rx="14" fill="#ffffff"/>
  <text x="24" y="32" font-size="18">The crystal oscillator: a loop that only rings at 12 MHz</text>

  <g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- RP2040 box (dashed: inside is simplified) -->
    <rect x="40" y="70" width="260" height="210" rx="12" fill="#f1f3f5" stroke="#1971c2" stroke-width="2" stroke-dasharray="7 5"/>
    <!-- XIN wire inside: pin (300,120) -> (80,120) -> (80,175) -> triangle input (110,175) -->
    <polyline points="300,120 80,120 80,175 110,175" stroke="#1e1e1e" stroke-width="2"/>
    <!-- amplifier triangle -->
    <polygon points="110,145 110,205 180,175" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
    <circle cx="186" cy="175" r="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
    <!-- output to XOUT: (192,175)->(240,175)->(240,230)->(300,230) -->
    <polyline points="192,175 240,175 240,230 300,230" stroke="#1e1e1e" stroke-width="2"/>

    <!-- outside: XIN to node A (480,120) -->
    <line x1="300" y1="120" x2="600" y2="120" stroke="#1e1e1e" stroke-width="2"/>
    <!-- XOUT to R5 -->
    <line x1="300" y1="230" x2="350" y2="230" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="350" y="220" width="70" height="20" rx="3" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="420" y1="230" x2="480" y2="230" stroke="#1e1e1e" stroke-width="2"/>
    <!-- crystal X1 vertical between A(480,120) and B(480,230) -->
    <line x1="480" y1="120" x2="480" y2="152" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="458" y1="152" x2="502" y2="152" stroke="#1e1e1e" stroke-width="3"/>
    <rect x="462" y="160" width="36" height="30" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
    <line x1="458" y1="198" x2="502" y2="198" stroke="#1e1e1e" stroke-width="3"/>
    <line x1="480" y1="198" x2="480" y2="230" stroke="#1e1e1e" stroke-width="2"/>
    <circle cx="480" cy="120" r="4" fill="#1e1e1e" stroke="#1e1e1e"/>
    <circle cx="480" cy="230" r="4" fill="#1e1e1e" stroke="#1e1e1e"/>
    <!-- C3 from B down -->
    <line x1="480" y1="230" x2="480" y2="282" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="462" y1="282" x2="498" y2="282" stroke="#1e1e1e" stroke-width="3"/>
    <line x1="462" y1="292" x2="498" y2="292" stroke="#1e1e1e" stroke-width="3"/>
    <line x1="480" y1="292" x2="480" y2="340" stroke="#1e1e1e" stroke-width="2"/>
    <!-- C2 from A right then down -->
    <line x1="600" y1="120" x2="600" y2="182" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="582" y1="182" x2="618" y2="182" stroke="#1e1e1e" stroke-width="3"/>
    <line x1="582" y1="192" x2="618" y2="192" stroke="#1e1e1e" stroke-width="3"/>
    <line x1="600" y1="192" x2="600" y2="340" stroke="#1e1e1e" stroke-width="2"/>
    <!-- GND rail -->
    <line x1="480" y1="340" x2="600" y2="340" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="540" y1="340" x2="540" y2="352" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="524" y1="352" x2="556" y2="352" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="530" y1="358" x2="550" y2="358" stroke="#1e1e1e" stroke-width="2"/>
    <line x1="536" y1="364" x2="544" y2="364" stroke="#1e1e1e" stroke-width="2"/>

    <!-- loop arrow (purple) -->
    <path d="M 300,276 C 340,320 420,320 465,250" stroke="#7048e8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aP)"/>
    <path d="M 455,104 C 400,58 320,52 250,58" stroke="#7048e8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aP)"/>
  </g>

  <text x="56" y="94" font-size="14" fill="#1971c2">inside the RP2040 (simplified)</text>
  <text x="64" y="228" font-size="14">amplifier that</text>
  <text x="150" y="110" font-size="14"></text><text x="64" y="246" font-size="14">flips the signal</text>
  <text x="310" y="112" font-size="14">XIN (pin 20)</text>
  <text x="306" y="254" font-size="14">XOUT (pin 21)</text>
  
  <text x="385" y="210" text-anchor="middle" font-size="14">R5 1 kΩ</text>
  <text x="510" y="172" font-size="14">X1</text><text x="510" y="190" font-size="14">12 MHz</text>
  <text x="508" y="292" font-size="14">C3 15 pF</text>
  <text x="626" y="192" font-size="14">C2 15 pF</text>
  <text x="566" y="384" font-size="14">GND</text>
  <text x="300" y="338" font-size="13" fill="#7048e8">out to the crystal</text>
  <text x="470" y="74" font-size="13" fill="#7048e8">back to the input</text>

  <text x="24" y="412" font-size="14" fill="#495057">The amplifier pushes, the crystal and C2/C3 send the signal back, the amplifier pushes again.</text>
  <text x="24" y="434" font-size="14" fill="#495057">The crystal passes only a narrow band around 12.000 MHz: the one frequency that keeps going.</text>
  <text x="24" y="456" font-size="14" fill="#495057">R5 limits how hard the amplifier shakes the crystal. Dashed box = drawn simplified, not the real transistors.</text>
</svg>
