<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive" font-size="15" fill="#1e1e1e">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9" fill="none" stroke="#1e1e1e" stroke-width="1.6"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9" fill="none" stroke="#e03131" stroke-width="1.8"/></marker>
  </defs>
  <rect width="940" height="400" rx="14" fill="#ffffff"/>
  <text x="24" y="32" font-size="18">From one 12 MHz crystal to every clock in the chip (Pico SDK defaults)</text>

  <g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- ROSC -->
    <rect x="30" y="60" width="240" height="80" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
    <line x1="270" y1="100" x2="330" y2="100" stroke="#e03131" stroke-width="2" marker-end="url(#aR)"/>
    <rect x="335" y="65" width="200" height="70" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
    <!-- crystal + XOSC -->
    <rect x="30" y="200" width="100" height="70" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
    <line x1="130" y1="235" x2="160" y2="235" stroke="#1e1e1e" stroke-width="2" marker-end="url(#aK)"/>
    <rect x="165" y="200" width="160" height="70" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
    <!-- branches -->
    <polyline points="325,235 345,235 345,200 370,200" stroke="#1e1e1e" stroke-width="2" marker-end="url(#aK)"/>
    <polyline points="345,235 345,310 370,310" stroke="#1e1e1e" stroke-width="2" marker-end="url(#aK)"/>
    <rect x="375" y="170" width="220" height="60" rx="10" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
    <rect x="375" y="280" width="220" height="60" rx="10" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
    <line x1="595" y1="200" x2="650" y2="200" stroke="#1e1e1e" stroke-width="2" marker-end="url(#aK)"/>
    <line x1="595" y1="310" x2="650" y2="310" stroke="#1e1e1e" stroke-width="2" marker-end="url(#aK)"/>
    <rect x="655" y="170" width="260" height="60" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
    <rect x="655" y="280" width="260" height="60" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="7 5"/>
  </g>

  <text x="150" y="88" text-anchor="middle">ROSC (inside, no parts)</text>
  <text x="150" y="110" text-anchor="middle" font-size="14">~6.5 MHz (1.8–12 MHz)</text>
  <text x="150" y="130" text-anchor="middle" font-size="13" fill="#e03131">starts by itself at power-on</text>
  <text x="435" y="94" text-anchor="middle">boot: the bootrom</text>
  <text x="435" y="116" text-anchor="middle" font-size="14">runs on this (unit R2)</text>

  <text x="80" y="232" text-anchor="middle">X1</text>
  <text x="80" y="254" text-anchor="middle" font-size="14">12 MHz</text>
  <text x="245" y="230" text-anchor="middle">XOSC</text>
  <text x="245" y="252" text-anchor="middle" font-size="13">off until software</text>
  <text x="245" y="266" text-anchor="middle" font-size="13">turns it on (~1 ms)</text>

  <text x="485" y="196" text-anchor="middle">PLL_SYS</text>
  <text x="485" y="218" text-anchor="middle" font-size="14">12 × 125 = 1500, ÷ 6 ÷ 2</text>
  <text x="485" y="306" text-anchor="middle">PLL_USB</text>
  <text x="485" y="328" text-anchor="middle" font-size="14">12 × 100 = 1200, ÷ 5 ÷ 5</text>

  <text x="785" y="196" text-anchor="middle">125 MHz: clk_sys</text>
  <text x="785" y="218" text-anchor="middle" font-size="14">both cores, flash, most of the chip</text>
  <text x="785" y="306" text-anchor="middle">48 MHz: clk_usb</text>
  <text x="785" y="328" text-anchor="middle" font-size="14" fill="#7048e8">USB needs this exact (unit R4)</text>

  <text x="24" y="376" font-size="13" fill="#495057">PLL = phase-locked loop: a circuit that multiplies a frequency. Numbers in MHz, from the RP2040 datasheet §2.18.3.</text>
  <text x="24" y="394" font-size="13" fill="#495057">The ÷ values are set by software, so a different program can choose other speeds from the same crystal.</text>
</svg>
